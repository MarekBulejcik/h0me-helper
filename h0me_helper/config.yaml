# H0me helper, a Home Assistant app (add-on). Home Assistant builds it on the Pi from the Dockerfile.
name: H0me helper
version: "0.4.0"
slug: h0me_helper
description: Connects Home Assistant to H0me with one connection out. Nothing comes in.
url: https://github.com/MarekBulejcik/h0me-helper
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# No ports, no host network, no Supervisor or Home Assistant admin access: it talks to Home
# Assistant only with the limited user's token you give it below.
options:
  h0me_url: "wss://h0me.homestudio.workers.dev/api/house/public/helper"
  h0me_secret: ""
  ha_url: "ws://homeassistant:8123/api/websocket"
  ha_token: ""
  entities:
    - light.main_lights
    - light.window_bulb
    - light.door_bulb
    - light.bed_bulb
    - light.mood_lights
    - light.desk_light
    - light.cabinet_light
    - switch.shelf_lights_outlet
    - switch.donut_light_outlet
    - input_select.my_room_scene
    - script.my_room_set_scene
    - climate.marek_air_conditioner
    - scene.purify
    - scene.chill
    - scene.wind
    - humidifier.smart_humidifier_lite
    - sensor.marek_air_conditioner_temperature
    - sensor.marek_air_conditioner_humidity
    - binary_sensor.my_room_occupied
    - sensor.my_room_current_zone
    - device_tracker.poco_f8_ultra
    - input_boolean.my_room_security_mode
schema:
  h0me_url: str
  h0me_secret: password
  ha_url: str
  ha_token: password
  entities:
    - str
